<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Page for a website</title>
  <style>
    :root {
      color: #ffb428;
      background: #fcde9e;
      font-family: Arial, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(90%, 620px);
      padding: 2.5rem;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgb(31 41 55 / 12%);
    }

    h1 {
      margin-top: 0;
      color: #4338ca;
    }

    p {
      line-height: 1.6;
    }

    code {
      padding: 0.15rem 0.35rem;
      background: #eef2ff;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Basic Page for a possible website!</h1>
    <p>This basic page is the start of a possible new website possibly about cats!</p>
    <p>Code and wordings are subject to change.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
